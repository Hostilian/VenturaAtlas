name: Submit evidence
description: Add supporting or contradictory evidence
title: "[Submit evidence] "
labels: ["collaboration"]
body:
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Include stable IDs, sources, evidence, assumptions, and requested outcome.
    validations:
      required: true
  - type: checkboxes
    id: provenance
    attributes:
      label: Provenance confirmation
      options:
        - label: I distinguished evidence, assumptions, and personal opinion.
          required: true
