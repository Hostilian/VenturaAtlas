name: Autonomous Runtime Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      simulation:
        description: 'Dispatch-only monitor proof mode'
        required: false
        default: live
        type: choice
        options:
          - live
          - stale
          - healthy

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Evaluate cloud recurrence
        id: health
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/va-cloud-monitor.py --simulation "${{ inputs.simulation || 'live' }}"

      - name: Open one deduplicated alert issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Autonomy Alert] research cycle is stale or repeatedly failing'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file .agent-state/cloud-monitor.json
          fi

      - name: Close recovered alert
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='[Autonomy Alert] research cycle is stale or repeatedly failing'
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --comment 'Automated recovery check passed.'
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: cloud-monitor-${{ github.run_id }}
          path: .agent-state/cloud-monitor.json
          include-hidden-files: true
          retention-days: 30

      - name: Preserve alert status
        if: steps.health.outcome == 'failure'
        run: exit 1
