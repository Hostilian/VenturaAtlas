name: Constitution integrity

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Research Constitution Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python runtime
        uses: actions/setup-python@0b93645e9fea7312eed9775ab9232c02b76077b9 # v5.3.0
        with:
          python-version-file: '.python-version'

      - name: Execute constitution verification script
        run: python scripts/verify_constitution.py
