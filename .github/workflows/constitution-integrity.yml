name: Constitution integrity

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Research Constitution Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute constitution verification script
        run: python scripts/verify_constitution.py
