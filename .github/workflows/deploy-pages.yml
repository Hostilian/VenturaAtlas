name: Validate and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository & Build Public Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Run source quality gates
        run: npm run quality:source

      - name: Run runtime contract tests
        run: npm run test:runtime

      - name: Run race condition tests
        run: npm run test:race

      - name: Run provider mock tests (no real API keys required)
        run: npm run test:providers

      - name: Run PWA contract tests
        run: npm run test:pwa

      - name: Build verified public site artifact (_site)
        run: npm run build:verified

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages artifact to production
        id: deployment
        uses: actions/deploy-pages@v4
