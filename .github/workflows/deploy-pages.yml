name: Validate and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository & Build Public Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Python test requirements
        run: python -m pip install --disable-pip-version-check -r services/ventureatlas-worker/requirements.txt

      - name: Run source quality gates
        run: npm run quality:source

      - name: Upload source-quality receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-source-quality-receipt
          path: .agent-state/quality-receipts/quality-source-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run runtime contract tests
        run: npm run test:runtime

      - name: Run race condition tests
        run: npm run test:race

      - name: Run provider mock tests (no real API keys required)
        run: npm run test:providers

      - name: Run PWA contract tests
        run: npm run test:pwa

      - name: Build and receipt verified public site artifact (_site)
        run: npm run quality:artifact

      - name: Upload artifact-quality receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-artifact-quality-receipts
          path: |
            .agent-state/quality-receipts/quality-artifact-latest.json
            .agent-state/quality-receipts/public-artifact-manifest-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages artifact to production
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
