name: Validate and Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository & Build Public Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Python test requirements
        run: python -m pip install --disable-pip-version-check -r services/ventureatlas-worker/requirements.txt

      - name: Run source quality gates
        run: npm run quality:source

      - name: Upload source-quality receipt
        if: always()
        uses: actions/upload-artifact@4bec3544d6735c03dfd3648a562479e0fceeedb5 # v4.6.1
        with:
          name: pages-source-quality-receipt
          path: .agent-state/quality-receipts/quality-source-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run runtime contract tests
        run: npm run test:runtime

      - name: Run race condition tests
        run: npm run test:race

      - name: Run provider mock tests (no real API keys required)
        run: npm run test:providers

      - name: Run PWA contract tests
        run: npm run test:pwa

      - name: Build and receipt verified public site artifact (_site)
        run: npm run quality:artifact

      - name: Upload artifact-quality receipts
        if: always()
        uses: actions/upload-artifact@4bec3544d6735c03dfd3648a562479e0fceeedb5 # v4.6.1
        with:
          name: pages-artifact-quality-receipts
          path: |
            .agent-state/quality-receipts/quality-artifact-latest.json
            .agent-state/quality-receipts/public-artifact-manifest-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages artifact to production
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
