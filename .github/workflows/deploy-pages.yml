name: Validate and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository & Build Public Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js runtime
        uses: actions/setup-node@39370e3970a6d050c08001799790b4d4a8e32630 # v4.1.0
        with:
          node-version-file: '.node-version'

      - name: Set up Python runtime
        uses: actions/setup-python@0b93645e9fea7312eed9775ab9232c02b76077b9 # v5.3.0
        with:
          python-version-file: '.python-version'

      - name: Run unit & smoke test suite
        run: npm test

      - name: Validate dataset & JSON schema
        run: npm run validate

      - name: Check JavaScript syntax
        run: npm run check-js

      - name: Verify internal link integrity
        run: npm run check-links

      - name: Build public allowlisted staging artifact (_site)
        run: npm run build-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy Pages artifact to production
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
