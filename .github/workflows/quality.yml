name: Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'automation/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r services/ventureatlas-worker/requirements.txt

      - name: Run quality:source
        run: npm run quality:source

      - name: Upload source-quality receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-quality-receipt
          path: .agent-state/quality-receipts/quality-source-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run runtime contract tests
        run: npm run test:runtime

      - name: Run race tests
        run: npm run test:race

      - name: Run provider mock tests (no real API calls)
        run: npm run test:providers

      - name: Run PWA structural tests
        run: npm run test:pwa
