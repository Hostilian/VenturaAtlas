name: Quality Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'automation/**'
      - 'fix/**'
      - 'feat/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r services/ventureatlas-worker/requirements.txt

      - name: Run quality:source
        run: npm run quality:source

      - name: Upload source-quality receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: source-quality-receipt
          path: .agent-state/quality-receipts/quality-source-latest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Run runtime contract tests
        run: npm run test:runtime

      - name: Run race tests
        run: npm run test:race

      - name: Run provider mock tests (no real API calls)
        run: npm run test:providers

      - name: Run PWA structural tests
        run: npm run test:pwa
