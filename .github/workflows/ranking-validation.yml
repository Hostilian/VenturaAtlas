name: Ranking Integrity & Reproducibility Validation

on:
  schedule:
    - cron: '0 6 * * *'  # Run daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rankings:
    name: Validate Canonical Ranking Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js runtime
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Recalculate rankings & check consistency
        run: node scripts/calculate-rankings.js --check
