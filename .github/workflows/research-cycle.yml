name: Cloud Research, Cross-Check & Staging Cycle

on:
  schedule:
    - cron: '17 * * * *' # Hourly cloud recurrence; GitHub may delay scheduled starts.
  workflow_dispatch:

concurrency:
  group: venture-atlas-cloud-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research-check:
    name: Bounded Autonomous Research & Triple Review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VA_EXECUTION_SCOPE: cloud
      PARALLEL_AI_ORCHESTRATION: '1'
      IDEAS_PER_ITERATION: '2'
      VA_DISCOVERY_MAX_CONCURRENCY: '2'
      VA_PROVIDER_FANOUT: '3'
      VA_PANEL_RETRIES: '1'
      VA_MAX_COST_CLASS: '1'
      VA_DISPATCH_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
      VA_DAILY_BUDGET_USD: '10'
      VA_MONTHLY_BUDGET_USD: '100'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Restore private autonomous state
        id: restore-private-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/idea-staging-queue.json
            .agent-state/crosschecks
            .agent-state/provider-state.json
            .agent-state/provider-call-ledger.json
            .agent-state/dispatch-runtime.json
            .agent-state/source-acquisition
            .agent-state/task-schedule.json
          key: private-research-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            private-research-state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r cloud-control-plane/requirements.txt -r services/ventureatlas-worker/requirements.txt

      - name: Run bounded comprehensive pipeline
        id: comprehensive-pipeline
        env:
          # Provider secrets are available only to the orchestrator process,
          # never to checkout, setup, cache, or artifact actions.
          NVIDIA_NIM_API_KEYS: ${{ secrets.NVIDIA_NIM_API_KEYS }}
          COHERE_API_KEYS: ${{ secrets.COHERE_API_KEYS }}
          OPENROUTER_API_KEYS: ${{ secrets.OPENROUTER_API_KEYS }}
          ANTHROPIC_API_KEYS: ${{ secrets.ANTHROPIC_API_KEYS }}
          ACTIVE_API_KEYS: ${{ secrets.ACTIVE_API_KEYS }}
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
        run: >-
          python scripts/va-massive-orchestrator.py
          --once
          --max-iterations 1
          --max-runtime-minutes 24
          --step-timeout-seconds 600
          --panel-size 3
          --panel-limit 2
          --strict-panel

      - name: Build starvation-resistant recurring task schedule
        if: always()
        run: python scripts/va-priority-aging.py

      - name: Validate private state before persistence
        id: private-state-valid
        if: always()
        run: >-
          python -c "import json, pathlib;
          p=pathlib.Path('data/idea-staging-queue.json');
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else [];
          assert isinstance(data,list) and all(isinstance(x,dict) and str(x.get('id','')).startswith('candidate-') for x in data)"

      - name: Save private autonomous state
        if: always() && steps.private-state-valid.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            data/idea-staging-queue.json
            .agent-state/crosschecks
            .agent-state/provider-state.json
            .agent-state/provider-call-ledger.json
            .agent-state/dispatch-runtime.json
            .agent-state/source-acquisition
            .agent-state/task-schedule.json
          key: private-research-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Generate sanitized execution receipt
        if: always()
        run: >-
          python -c "import json, pathlib, hashlib;
          p=pathlib.Path('data/idea-staging-queue.json');
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else [];
          digest=hashlib.sha256(json.dumps(data, sort_keys=True).encode('utf-8')).hexdigest() if data else 'none';
          receipt={'schemaVersion': '2.0.0', 'runId': '${{ github.run_id }}', 'candidateCount': len(data), 'candidateDigest': digest, 'sanitized': True};
          pathlib.Path('.agent-state').mkdir(exist_ok=True);
          pathlib.Path('.agent-state/sanitized-execution-receipt.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')"

      - name: Upload unattended execution receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: venture-atlas-unattended-receipts-${{ github.run_id }}
          path: .agent-state/sanitized-execution-receipt.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
