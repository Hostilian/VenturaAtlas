name: Validate data

on: [pull_request]

permissions:
  contents: read

jobs:
  validate:
    name: Run PR Validation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js runtime
        uses: actions/setup-node@39370e3970a6d050c08001799790b4d4a8e32630 # v4.1.0
        with:
          node-version-file: '.node-version'

      - name: Set up Python runtime
        uses: actions/setup-python@0b93645e9fea7312eed9775ab9232c02b76077b9 # v5.3.0
        with:
          python-version-file: '.python-version'

      - name: Run unit & smoke test suite
        run: npm test

      - name: Validate dataset & JSON schema
        run: npm run validate

      - name: Check JavaScript syntax
        run: npm run check-js
