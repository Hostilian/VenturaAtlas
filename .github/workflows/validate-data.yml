name: Validate data

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Run PR Validation Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r services/ventureatlas-worker/requirements.txt

      - name: Run Authoritative Quality Gate
        run: npm run quality
