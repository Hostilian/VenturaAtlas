name: Weekly Artifact, Security, Accessibility & Recovery Drill

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install reproducible dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check -r cloud-control-plane/requirements.txt -r services/ventureatlas-worker/requirements.txt

      - name: Full source and artifact quality gate
        run: npm run quality

      - name: Python runtime and failure-injection suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Desktop and mobile accessibility journeys
        run: npm run test:e2e

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Recovery from a clean generated-artifact baseline
        run: npm run clean && npm run build:verified

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        if: always()
        with:
          name: weekly-resilience-receipts-${{ github.run_id }}
          path: |
            .agent-state/quality-receipts
            data/build-manifest.json
            data/repository-meta.json
            playwright-report
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 90
