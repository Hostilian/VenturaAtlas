<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="The requested Venture Atlas page could not be found.">
  <title>Page Not Found — Venture Atlas OS</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: Canvas;
      color: CanvasText;
    }
    main {
      width: min(680px, 100%);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem color-mix(in srgb, CanvasText 12%, transparent);
    }
    .code { color: #21825f; font-size: 0.8rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0.4rem 0 0.75rem; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.05; }
    p { line-height: 1.65; color: color-mix(in srgb, CanvasText 72%, transparent); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.4rem; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.6rem 0.9rem;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 0.65rem;
      color: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    a.primary { background: #17664a; border-color: #17664a; color: white; }
    a:hover, a:focus-visible { outline: 3px solid color-mix(in srgb, #21825f 45%, transparent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404 · Page not found</div>
    <h1>This path is not in the Atlas.</h1>
    <p>The link may be old, incomplete, or mistyped. Your browser is online; this is a missing-page response, not an offline warning.</p>
    <div class="actions">
      <a class="primary" data-app-path="index.html" href="./index.html">Return home</a>
      <a data-app-path="index.html#directory" href="./index.html#directory">Browse ideas</a>
      <a data-app-path="docs/getting-started.html" href="./docs/getting-started.html">Getting started</a>
      <a data-app-path="docs/live-progress.html" href="./docs/live-progress.html">Automation status</a>
    </div>
  </main>
  <script>
    (function repairLocalLinks() {
      const githubProjectRoot = '/VenturaAtlas/';
      const appRoot = location.hostname.endsWith('.github.io') ? githubProjectRoot : '/';
      document.querySelectorAll('[data-app-path]').forEach(link => {
        link.href = `${appRoot}${link.dataset.appPath}`;
      });
    }());
  </script>
</body>
</html>
