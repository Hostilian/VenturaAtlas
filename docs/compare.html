<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Ideas — Venture Atlas OS</title>
  <meta name="description" content="Compare up to four Venture Atlas ideas side-by-side using their available scores, evidence, customer profiles, risks, and timelines.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../assets/css/site.css?v=2.7.1">
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body data-page="compare" data-root="..">
  <main id="main">
    <section class="section">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../index.html">Ideas</a>
        <span class="sep">›</span>
        <span>Compare</span>
      </nav>
      <h1 style="font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:0.5rem">Compare Ideas</h1>
      <p class="lede" style="margin-bottom:1.25rem">
        Choose two to four ideas to compare side-by-side. Scores support discussion; they do not decide personal fit.
      </p>
      <div class="toolbar" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        <!-- Four unique selects — site.js queries by data-compare-select attribute, not by ID -->
        <select data-compare-select="0" aria-label="First idea to compare">
          <option value="">Choose first idea…</option>
        </select>
        <select data-compare-select="1" aria-label="Second idea to compare">
          <option value="">Choose second idea…</option>
        </select>
        <select data-compare-select="2" aria-label="Third idea to compare (optional)">
          <option value="">Third idea (optional)…</option>
        </select>
        <select data-compare-select="3" aria-label="Fourth idea to compare (optional)">
          <option value="">Fourth idea (optional)…</option>
        </select>
      </div>
    </section>

    <div id="comparison">
      <div class="empty">
        <strong>Choose two to four ideas to compare.</strong>
        The comparison table will appear here.
      </div>
    </div>
  </main>
  <script src="../assets/js/config.js?v=2.7.1"></script>
  <script src="../assets/js/core/studio-store.js?v=2.7.1"></script>
  <script src="../assets/js/site.js?v=2.7.1"></script>
  <script src="../assets/js/features/compare.js?v=2.7.1"></script>
  <script src="../assets/js/features/command-palette.js?v=2.7.1"></script>
</body>
</html>
