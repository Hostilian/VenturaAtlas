<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rankings — Venture Atlas OS</title>
  <meta name="description" content="Explore canonical decision-support ranking views across overall score, speed to revenue, lowest startup cost, solo founder fit, evidence confidence, and tournament finalists.">
  <meta name="robots" content="index, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../assets/css/site.css?v=2.7.1">
  <link rel="manifest" href="../manifest.webmanifest">
</head>
<body data-page="rankings" data-root="..">
  <main id="main">
    <section class="section" style="margin-bottom:1.5rem">
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="../index.html">Ideas</a>
        <span class="sep">›</span>
        <span>Rankings</span>
      </nav>
      <h1 style="font-size:clamp(1.5rem,4vw,2.5rem);margin-bottom:0.5rem">Ranking Views</h1>
      <p class="lede" style="margin-bottom:1.25rem">
        Choose a decision lens. Each ranking view applies weighted scoring to highlight ideas matching specific founder constraints and market criteria.
      </p>
      <div class="toolbar" style="grid-template-columns:1fr">
        <select id="rankingSelect" aria-label="Select ranking view">
          <option value="overall-top-opportunities">🏆 Overall Top Opportunities</option>
          <option value="attractiveness">💡 High Opportunity Attractiveness</option>
          <option value="founder-fit">🎯 Best Solo Founder Fit</option>
          <option value="highest-confidence">🛡️ Highest Evidence Confidence</option>
          <option value="fastest-first-revenue">⚡ Fastest Path to Revenue</option>
          <option value="lowest-startup-cost">💸 Lowest Startup Capital</option>
          <option value="reset-finalists">🏁 Reset Tournament Finalists</option>
        </select>
      </div>
    </section>

    <div id="ranking">
      <!-- Populated by site.js initRankings() -->
    </div>
  </main>
  <script src="../assets/js/site.js?v=2.7.1"></script>
  <script src="../assets/js/features/rankings.js?v=2.7.1"></script>
  <script src="../assets/js/features/command-palette.js?v=2.7.1"></script>
</body>
</html>
