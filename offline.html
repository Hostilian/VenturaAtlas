<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Venture Atlas OS</title>
  <link rel="stylesheet" href="./assets/css/site.css?v=2.7.1">
  <style>
    :root {
      color-scheme: light dark;
      --panel: Canvas;
      --bg2: color-mix(in srgb, CanvasText 6%, Canvas);
      --line: color-mix(in srgb, CanvasText 18%, transparent);
      --text: CanvasText;
      --text2: color-mix(in srgb, CanvasText 72%, transparent);
      --muted: color-mix(in srgb, CanvasText 55%, transparent);
      --radius-lg: 1rem;
      --shadow-sm: 0 1rem 3rem color-mix(in srgb, CanvasText 10%, transparent);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1.25rem; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: Canvas; color: CanvasText; }
    .offline-container {
      max-width: 600px;
      margin: 4rem auto;
      text-align: center;
      padding: 2rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }
    .offline-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .offline-progress {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg2);
      color: var(--text);
      text-decoration: none;
    }
    .offline-progress__dot {
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: var(--muted);
    }
    .button { display: inline-flex; align-items: center; min-height: 2.75rem; padding: 0.6rem 0.9rem; border: 1px solid var(--line); border-radius: 0.65rem; background: var(--panel); color: var(--text); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .button-primary { background: #17664a; border-color: #17664a; color: #fff; }
  </style>
</head>
<body>
  <main class="offline-container">
    <div class="offline-icon">📡</div>
    <h1>You are currently offline</h1>
    <p style="margin: 1rem 0; color: var(--text2);">
      Venture Atlas OS could not reach the network to load this page. Cached sections and previously loaded data remain accessible.
    </p>
    <div style="display:flex;justify-content:center;gap:1rem;margin-top:1.5rem;flex-wrap:wrap">
      <a id="offline-home" href="./index.html" class="button button-primary">Go to Home</a>
      <button id="reload-btn" class="button">Try Reconnecting</button>
    </div>
    <a id="offline-status" class="offline-progress" href="./docs/live-progress.html">
      <span class="offline-progress__dot"></span>
      <span>View cached automation status</span>
    </a>
    <p style="font-size:0.8rem;color:var(--muted);margin:0.75rem 0 0">Cached status may be stale while you are offline.</p>
  </main>
  <script>
    document.getElementById('reload-btn')?.addEventListener('click', function() {
      window.location.reload();
    });
    const appRoot = location.hostname.endsWith('.github.io') ? '/VenturaAtlas/' : '/';
    document.getElementById('offline-home').href = `${appRoot}index.html`;
    document.getElementById('offline-status').href = `${appRoot}docs/live-progress.html`;
  </script>
</body>
</html>
